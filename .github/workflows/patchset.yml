name: Test patches and build binaries

on:
  pull_request:
    branches: [patches]
  push:
    branches: [patches]
    tags: ['patches-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.manifest.outputs.base }}
      tree: ${{ steps.replay.outputs.tree }}
    steps:
      - name: Check out the patch revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the patch tools and read the base
        id: manifest
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tools
          base=$(python3 -c 'from tools.patchset import load_manifest; print(load_manifest()["base"])')
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Check out the official base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: AlexxIT/go2rtc
          ref: ${{ steps.manifest.outputs.base }}
          fetch-depth: 0
          path: .work/application
          persist-credentials: false

      - name: Check and apply the manifest
        id: replay
        run: |
          python3 tools/patchset.py check --target .work/application
          groups=$(python3 -c 'from tools.patchset import load_manifest; print(*(p["id"] for p in load_manifest()["patches"]))')
          for group in $groups; do
            python3 tools/patchset.py check --target .work/application --only "$group"
          done
          python3 tools/patchset.py apply --target .work/application
          git -C .work/application diff --exit-code
          git -C .work/application diff --cached --check
          tree=$(git -C .work/application write-tree)
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run patch and project tests
        run: python3 tools/patchset.py test --target .work/application --tier all

  build:
    name: Build go2rtc_linux_arm64
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out the patch revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the official base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: AlexxIT/go2rtc
          ref: ${{ needs.validate.outputs.base }}
          fetch-depth: 0
          path: .work/application
          persist-credentials: false

      - name: Reproduce the validated tree
        env:
          VALIDATED_TREE: ${{ needs.validate.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/patchset.py apply --target .work/application
          test "$(git -C .work/application write-tree)" = "$VALIDATED_TREE"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build the binary
        working-directory: .work/application
        env:
          GOOS: linux
          GOARCH: arm64
          GOARM64: v8.0
        run: go build -mod=readonly -ldflags "-s -w" -trimpath -o go2rtc_linux_arm64 .

      - name: Upload binary to the workflow run
        id: artifact
        if: >-
          github.repository == 'Ricky-Hao/go2rtc' &&
          ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/patches') ||
          (github.event_name == 'push' && github.event.deleted == false &&
          (github.ref == 'refs/heads/patches' || startsWith(github.ref, 'refs/tags/patches-'))))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go2rtc_linux_arm64
          path: .work/application/go2rtc_linux_arm64
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish Linux ARM64 release
    needs: build
    if: >-
      github.repository == 'Ricky-Hao/go2rtc' && github.event_name == 'push' &&
      github.event.deleted == false && startsWith(github.ref, 'refs/tags/patches-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: patchset-release-${{ github.ref }}
    steps:
      - name: Download the validated binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases_for_tag() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
              jq -s --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]'
          }

          releases=$(releases_for_tag)
          if jq -e 'any(.[]; .draft == false)' <<< "$releases" > /dev/null; then
            printf 'Release %s is already published.\n' "$GITHUB_REF_NAME"
            exit 0
          fi
          if jq -e 'length > 0' <<< "$releases" > /dev/null; then
            printf 'Draft already exists for %s. See docs/maintenance.md for recovery.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

          ref=$(jq -rn --arg ref "$GITHUB_REF" '$ref | @uri')
          verify_tag() {
            local sha
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)
            if [[ "$sha" != "$GITHUB_SHA" ]]; then
              printf 'Expected %s at %s, found %s.\n' "$GITHUB_REF" "$GITHUB_SHA" "$sha" >&2
              return 1
            fi
          }

          asset=dist/go2rtc_linux_arm64
          test -s "$asset"
          notes="NAS Linux ARM64 build from $GITHUB_SHA. [Actions run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          verify_tag
          gh release create "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "$notes"

          # Publish by ID to address only the draft just created by this run.
          release_id=$(releases_for_tag | jq -er --arg notes "$notes" --arg asset "${asset##*/}" '
            if length == 1 and (.[0] | .draft and .body == $notes and
              (.assets | map({name, state})) == [{name: $asset, state: "uploaded"}])
            then .[0].id
            else error("Expected the new draft with one uploaded ARM64 asset") end
          ')
          verify_tag
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name="$GITHUB_REF_NAME" -F draft=false --jq .html_url
